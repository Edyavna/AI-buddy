name: Frontend foundation
on:
  push:
    branches: [main, dev]
  pull_request:
    paths: ['frontend/**', 'contracts/**', '.github/workflows/frontend.yml', 'scripts/hr-coverage.mjs']
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check:api
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - name: Changed frontend lines above 90 percent
        if: github.event_name == 'pull_request' && (startsWith(github.head_ref, 'feat/62-hr') || startsWith(github.head_ref, 'feature/resolution-knowledge-drafts') || startsWith(github.head_ref, 'feature/shared-question-resolutions') || startsWith(github.head_ref, 'feature/question-context-preview'))
        shell: bash
        env:
          COVERAGE_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -o pipefail
          node ../scripts/hr-coverage.mjs "$COVERAGE_BASE" frontend | tee coverage/changed-lines.txt "$GITHUB_STEP_SUMMARY"
      - run: npm run test:e2e
      - run: npm run build
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
