name: Backend foundation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: buddy
          POSTGRES_PASSWORD: buddy_test_only
          POSTGRES_DB: buddy_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U buddy -d buddy_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://buddy:buddy_test_only@localhost:5432/buddy_test?sslmode=disable
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.5
          cache-dependency-path: backend/go.sum
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race -count=1 -coverpkg=./... -coverprofile=coverage.out ./...
      - run: go tool cover -func=coverage.out
      - run: go build ./...
      - uses: actions/upload-artifact@v4
        with:
          name: go-statement-coverage
          path: backend/coverage.out

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: contracts/requirements-check.txt
      - run: python -m pip install -r contracts/requirements-check.txt
      - run: python scripts/check_contracts.py

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 180 api
      - run: curl --fail http://localhost:8080/healthz && curl --fail http://localhost:8080/readyz
      - name: Reapply migrations
        run: docker compose run --rm migrate
      - name: Restart and check readiness
        run: |
          docker compose restart api
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://localhost:8080/readyz
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down
