name: Backend foundation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: buddy
          POSTGRES_PASSWORD: buddy_test_only
          POSTGRES_DB: buddy_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U buddy -d buddy_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://buddy:buddy_test_only@localhost:5432/buddy_test?sslmode=disable
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.node-version
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.5
          cache-dependency-path: backend/go.sum
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race -v -count=1 -timeout=2m -coverpkg=./... -coverprofile=coverage.out ./...
      - run: go tool cover -func=coverage.out
      - name: Go line coverage
        shell: bash
        run: |
          go test ../scripts/go_line_coverage.go ../scripts/go_line_coverage_test.go
          set -o pipefail
          go run ../scripts/go_line_coverage.go coverage.out | tee -a line-coverage.txt "$GITHUB_STEP_SUMMARY"
      - name: Changed backend lines above 90 percent
        if: github.event_name == 'pull_request' && (startsWith(github.head_ref, 'feat/62-hr') || startsWith(github.head_ref, 'feature/resolution-knowledge-drafts') || startsWith(github.head_ref, 'feature/shared-question-resolutions') || startsWith(github.head_ref, 'feature/question-context-preview'))
        shell: bash
        env:
          COVERAGE_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -o pipefail
          mkdir -p coverage
          go run ../scripts/go_line_coverage.go --lines coverage.out > coverage/lines.tsv
          node ../scripts/hr-coverage.mjs "$COVERAGE_BASE" backend | tee -a line-coverage.txt "$GITHUB_STEP_SUMMARY"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: go-line-coverage
          path: backend/line-coverage.txt
      - run: go build ./...
      - uses: actions/upload-artifact@v4
        with:
          name: go-statement-coverage
          path: backend/coverage.out

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: contracts/requirements-check.txt
      - run: python -m pip install -r contracts/requirements-check.txt
      - run: python scripts/check_contracts.py

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEMO_CHAT_DELAY: 1s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 180 frontend
      - run: curl --fail http://localhost:8080/healthz && curl --fail http://localhost:8080/readyz
      - name: Reapply migrations
        run: docker compose run --rm migrate
      - name: Seed demo accounts and save session and progress
        run: |
          docker compose --profile demo run --rm seed
          python scripts/smoke_session_onboarding.py prepare
          python scripts/smoke_chat.py prepare
      - name: Check the production SPA and live SSE through the same origin
        run: |
          python scripts/smoke_frontend.py
          python scripts/smoke_chat.py prepare --base http://localhost:5173 --state tmp/frontend-chat-smoke.json --check-streaming
      - name: Persist a probe and recreate containers without removing the volume
        run: |
          docker compose exec -T db psql -U buddy -d buddy -v ON_ERROR_STOP=1 -c "CREATE TABLE day1_restart_probe (id integer PRIMARY KEY); INSERT INTO day1_restart_probe VALUES (1);"
          docker compose down
          docker compose up -d --wait --wait-timeout 120 api
          curl --fail http://localhost:8080/readyz
          test "$(docker compose exec -T db psql -U buddy -d buddy -tAc 'SELECT count(*) FROM day1_restart_probe')" = "1"
          test "$(docker compose exec -T db psql -U buddy -d buddy -tAc 'SELECT count(*) FROM buddy_schema_migrations')" = "$(find backend/internal/platform/migrations/sql -name '*.sql' | wc -l | tr -d ' ')"
      - name: Repeat seed without resetting progress and verify after restart
        run: |
          docker compose --profile demo run --rm seed
          python scripts/smoke_session_onboarding.py verify
          python scripts/smoke_chat.py verify
      - name: Kill API during a generating chat reply
        run: python scripts/smoke_chat.py crash --docker
      - name: Recover interrupted generation without replaying the agent
        run: |
          docker compose up -d --wait --wait-timeout 120 api
          python scripts/smoke_chat.py recover
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down

  question-context-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'feature/question-context-preview')
    env:
      COMPOSE_FILE: compose.yaml:scripts/compose.hr-test.yaml
      CONTEXT_APP_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.node-version
      - run: npm install --no-save --package-lock=false playwright-core@1.60.0
      - run: npx playwright-core install --with-deps chromium
      - run: docker compose up --build --wait --wait-timeout 180 frontend hr-fixture
      - run: docker compose --profile demo run --rm seed
      - run: node scripts/question-context-browser.mjs
      - name: Persist approved context through restart and repeated seed
        run: |
          docker compose restart api hr-fixture
          docker compose up -d --wait api hr-fixture
          docker compose --profile demo run --rm seed
          node scripts/question-context-browser.mjs --verify
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: question-context-browser
          path: tmp/question-context-browser/
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down

  hr-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'feat/62-hr')
    env:
      COMPOSE_FILE: compose.yaml:scripts/compose.hr-test.yaml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.node-version
      - run: npm install --no-save --package-lock=false playwright-core
      - run: npx playwright-core install --with-deps chromium
      - run: docker compose up --build --wait --wait-timeout 180 frontend hr-fixture
      - run: docker compose --profile demo run --rm seed
      - run: HR_RESTART_COMPOSE=1 node scripts/hr-browser.mjs
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: hr-browser
          path: tmp/hr-browser/*.png
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down

  resolution-drafts-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'feature/resolution-knowledge-drafts')
    env:
      COMPOSE_FILE: compose.yaml:scripts/compose.hr-test.yaml
      RESOLUTION_APP_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.node-version
      - run: npm install --no-save --package-lock=false playwright-core@1.60.0
      - run: npx playwright-core install --with-deps chromium
      - run: docker compose up --build --wait --wait-timeout 180 frontend hr-fixture
      - run: docker compose --profile demo run --rm seed
      - run: node scripts/resolution-drafts-browser.mjs
      - name: Persist publications through restart and repeated seed
        run: |
          docker compose restart api hr-fixture
          docker compose up -d --wait api hr-fixture
          docker compose --profile demo run --rm seed
          node scripts/resolution-drafts-browser.mjs --verify
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: resolution-drafts-browser
          path: tmp/resolution-browser/
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down

  question-groups-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'feature/shared-question-resolutions')
    env:
      COMPOSE_FILE: compose.yaml:scripts/compose.hr-test.yaml
      GROUP_APP_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.node-version
      - run: npm install --no-save --package-lock=false playwright-core@1.60.0
      - run: npx playwright-core install --with-deps chromium
      - run: docker compose up --build --wait --wait-timeout 180 frontend hr-fixture
      - run: docker compose --profile demo run --rm seed
      - name: Assign two synthetic interns to the same mentor
        run: docker compose exec -T db psql -U buddy -d buddy -v ON_ERROR_STOP=1 -c "UPDATE mentor_assignments SET mentor_id='mentor_demo_1' WHERE intern_id='intern_demo_2'"
      - run: node scripts/question-groups-browser.mjs
      - name: Persist groups through API restart and repeated seed
        run: |
          docker compose restart api hr-fixture
          docker compose up -d --wait api hr-fixture
          docker compose --profile demo run --rm seed
          node scripts/question-groups-browser.mjs --verify
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: question-groups-browser
          path: tmp/question-groups-browser/
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down
