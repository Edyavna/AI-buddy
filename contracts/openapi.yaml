        '503':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: buddy_session
  responses:
    Error:
      description: 'JSON-ошибка до открытия потока: 400 — неверный формат; 401 — нет сессии;

        403 — операция запрещена; 404 — объект отсутствует или недоступен;

        409 — конфликт состояния; 422 — неверные поля; 429 — ограничение частоты;

        502/503 — недоступность внешнего сервиса; 500 — внутренняя ошибка.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    QuestionDirection:
      type: string
      enum:
        - mentor
        - hr
    QuestionStatus:
      type: string
      enum:
        - new
        - in_progress
        - resolved
    RoutingSuggestion:
      type: object
      required:
        - direction
        - reason
        - clarification
        - split
      properties:
        direction:
          type: string
          enum:
            - mentor
            - hr
            - needs_clarification
        reason:
          type: string
        clarification:
          type: string
          nullable: true
        split:
          type: boolean
    NullableRoutingSuggestion:
      type: object
      nullable: true
      required:
        - direction
        - reason
        - clarification
        - split
      properties:
        direction:
          type: string
          enum:
            - mentor
            - hr
            - needs_clarification
        reason:
          type: string
        clarification:
          type: string
          nullable: true
        split:
          type: boolean
    AccessScope:
      type: object
      required:
        - version
        - teams
      properties:
        version:
          type: string
        teams:
          type: array
          items:
            type: object
            required:
              - id
              - name
            properties:
              id:
                type: string
              name:
                type: string
    RoutedQuestion:
      type: object
      required:
        - id
        - message_id
        - team_id
        - direction
        - original_direction
        - student
        - specialist_id
        - step_id
        - status
        - revision
        - question
        - context_excerpt
        - resolution
        - document_ids
        - routing
        - created_at
        - updated_at
        - applied_revision
      properties:
        id:
          type: string
          format: uuid
        message_id:
          type: string
        team_id:
          type: string
        direction:
          $ref: '#/components/schemas/QuestionDirection'
        original_direction:
          $ref: '#/components/schemas/QuestionDirection'
        student:
          type: object
          required:
            - id
            - name
          properties:
            id:
              type: string
            name:
              type: string
        specialist_id:
          type: string
          nullable: true
        step_id:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/QuestionStatus'
        revision:
          type: integer
          minimum: 1
        question:
          type: string
        context_excerpt:
          type: string
        resolution:
          type: string
          nullable: true
        document_ids:
          type: array
          items:
            type: string
        routing:
          $ref: '#/components/schemas/NullableRoutingSuggestion'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        applied_revision:
          type: integer
          minimum: 1
          nullable: true
    QuestionDraft:
      type: object
      required:
        - direction
        - question
        - context_excerpt
      properties:
        direction:
          $ref: '#/components/schemas/QuestionDirection'
        question:
          type: string
        context_excerpt:
          type: string
    QuestionDraftInput:
      type: object
      required:
        - question
        - context_excerpt
      properties:
        question:
          type: string
        context_excerpt:
          type: string
    RoutedQuestions:
      type: object
      required:
        - items
        - drafts
        - question
        - available_directions
        - routing
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RoutedQuestion'
        drafts:
          type: array
          items:
            $ref: '#/components/schemas/QuestionDraft'
        question:
          type: string
        available_directions:
          type: array
          items:
            $ref: '#/components/schemas/QuestionDirection'
        routing:
          $ref: '#/components/schemas/NullableRoutingSuggestion'
    QuestionHistory:
      type: object
      required:
        - question
        - history
      properties:
        question:
          $ref: '#/components/schemas/RoutedQuestion'
        history:
          type: array
          items:
            type: object
            required:
              - revision
              - snapshot
            properties:
              revision:
                type: integer
                minimum: 1
              snapshot:
                type: object
                additionalProperties: true
    CreateRoutedQuestion:
      type: object
      required:
        - operation_id
        - direction
        - question
        - context_excerpt
      properties:
        operation_id:
          type: string
          format: uuid
        direction:
          $ref: '#/components/schemas/QuestionDirection'
        question:
          type: string
        context_excerpt:
          type: string
    RerouteQuestion:
      type: object
      required:
        - operation_id
        - revision
        - direction
        - question
        - context_excerpt
      properties:
        operation_id:
          type: string
          format: uuid
        revision:
          type: integer
          minimum: 1
        direction:
          $ref: '#/components/schemas/QuestionDirection'
        question:
          type: string
        context_excerpt:
          type: string
    UpdateHRQuestion:
      type: object
      required:
        - operation_id
        - revision
        - action
      properties:
        operation_id:
          type: string
          format: uuid
        revision:
          type: integer
          minimum: 1
        action:
          type: string
          enum:
            - claim
            - answer
            - resolve
            - reopen
        resolution:
          type: string
        document_ids:
          type: array
          items:
            type: string
    HRDocument:
      type: object
      required:
        - id
        - author_id
        - direction
        - title
        - content
        - team_ids
        - version
        - published_version
        - revoked
        - status
        - error
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        author_id:
          type: string
        direction:
          type: string
          enum:
            - hr
        title:
          type: string
        content:
          type: string
        team_ids:
          type: array
          items:
            type: string
        version:
          type: integer
          minimum: 1
        published_version:
          type: integer
          minimum: 1
          nullable: true
        revoked:
          type: boolean
        status:
          type: string
          enum:
            - draft
            - indexing
            - ready
            - failed
        error:
          type: string
          nullable: true
        updated_at:
          type: string
          format: date-time
    CreateHRDocument:
      type: object
      required:
        - operation_id
        - title
        - content
        - team_ids
      properties:
        operation_id:
          type: string
          format: uuid
        title:
          type: string
        content:
          type: string
        team_ids:
          type: array
          items:
            type: string
    EditHRDocument:
      type: object
      required:
        - version
        - title
        - content
        - team_ids
      properties:
        version:
          type: integer
          minimum: 1
        title:
          type: string
        content:
          type: string
        team_ids:
          type: array
          items:
            type: string
    HRDocumentVersion:
      type: object
      required:
        - version
      properties:
        version:
          type: integer
          minimum: 1
    ApiError:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          - trace_id
          properties:
            code:
              type: string
              example: GENERATION_IN_PROGRESS
              description: Стабильные коды и HTTP-статусы перечислены в behavior.md. Неизвестный код отображается
                как общая ошибка.
            message:
              type: string
              example: Дождитесь завершения текущего ответа
            trace_id:
              type: string
              description: Идентификатор для поиска в серверных логах
            field_errors:
              type: object
              additionalProperties:
                type: string
    User:
      type: object
      required:
      - id
      - name
      - role
      - team
      properties:
        id:
          type: string
        name:
          type: string
        role:
          type: string
          enum:
          - intern
          - mentor
          - hr
        team:
          type: object
          required:
          - id
          - name
          properties:
            id:
              type: string
            name:
              type: string
    Plan:
      type: object
      required:
      - id
      - title
      - progress_percent
      - next_step_id
      - steps
      properties:
        id:
          type: string
        title:
          type: string
        progress_percent:
          type: integer
          minimum: 0
          maximum: 100
          description: Рассчитывает сервер
        next_step_id:
          type: string
          nullable: true
        steps:
          type: array
          items:
            $ref: '#/components/schemas/Step'
      description: progress_percent=floor(100*completed/total); пустой план дает 0. next_step_id — первый незавершенный
        неблокированный шаг, иначе null. Статусы и порядок определяет сервер.
    Step:
      type: object
      required:
      - id
      - title
      - description
      - status
      - request_ids
      - allowed_statuses
      - blocked_reason
      - template_key
      - period
      - completion_policy
      - confirmations
      - revision
      - allowed_actions
      - awaiting_role
      - instructions
      - resources
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
          description: Markdown
        status:
          type: string
          enum:
          - not_started
          - in_progress
          - blocked
          - completed
        request_ids:
          type: array
          items:
            type: string
        allowed_statuses:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
            - not_started
            - in_progress
            - completed
          description: Разрешенные сейчас цели PATCH; пустой массив — нет доступных изменений.
        blocked_reason:
          type: string
          nullable: true
          description: Понятная причина блокировки; null если блокировки нет.
        template_key:
          type: string
          minLength: 1
          description: Стабильный ключ внутри плана; у старых шагов совпадает с id.
        period:
          type: string
          nullable: true
