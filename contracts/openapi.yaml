          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /demo/session:
    post:
      tags:
      - Session
      operationId: createDemoSession
      security: []
      description: 'Только DEMO_MODE. Создает сессию синтетического пользователя.

        Cookie buddy_session: HttpOnly, SameSite=Lax, Path=/; Secure при HTTPS.

        В рабочей среде этот маршрут отсутствует: сессию обеспечивает корпоративная авторизация.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - account_id
              properties:
                account_id:
                  type: string
              additionalProperties: false
      responses:
        '200':
          description: Сессия установлена через Set-Cookie
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Error'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '429':
