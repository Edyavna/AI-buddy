    AccessRequest:
      type: object
      required:
      - id
      - draft_version
      - conversation_id
      - step_id
      - resource
      - reason
      - status
      - external_id
      - status_checked_at
      - created_at
      - updated_at
      - revision
      properties:
        id:
          type: string
        draft_version:
          type: integer
          minimum: 1
        conversation_id:
          type: string
        step_id:
          type: string
          nullable: true
        resource:
          type: object
          required:
          - id
          - name
          - permission
          properties:
            id:
              type: string
            name:
              type: string
            permission:
              type: string
              enum:
              - read
              - write
        reason:
          type: string
        status:
          type: string
          enum:
          - draft
          - submitting
          - pending
          - granted
          - rejected
          - failed
          description: 'draft — ожидает подтверждения; submitting — отправляется или сверяется;

            pending — создана и ожидает решения; granted — сервис подтвердил выдачу доступа;

            rejected — отклонена; failed — достоверная ошибка отправки без создания заявки.

            '
        external_id:
          type: string
          nullable: true
          description: Номер во внешнем сервисе; обязателен после успешного создания
        status_checked_at:
          type: string
          format: date-time
          nullable: true
