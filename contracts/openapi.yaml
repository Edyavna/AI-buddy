      description: 'Отправка через fetch POST; ответ — text/event-stream. Native EventSource не используется.

        client_message_id — UUID, созданный фронтом для одной отправки.

        Повтор того же ID с тем же содержимым возвращает 409 MESSAGE_ALREADY_EXISTS;

        фронт загружает историю, повторно генерацию не запускает.

        Тот же ID с другим содержимым — 409 IDEMPOTENCY_CONFLICT.

        Одновременно разрешена одна генерация на диалог, иначе 409 GENERATION_IN_PROGRESS.

        Бэкенд сохраняет сообщения до ответа и при потере соединения отменяет генерацию,

        сохраняет частичный результат со статусом interrupted, если она еще не завершилась.


        client_message_id уникален в диалоге; повтор проверяется ДО занятой генерации. User и assistant создаются
        атомарно. Корреляция восстановления — in_reply_to_message_id. Подробнее behavior.md.'
