openapi: 3.0.3
info:
  title: AI-buddy — Frontend API
  version: 0.2.0
  description: 'Предлагаемый контракт MVP. Все адреса относительно /api/v1.

    Пользователь и команда определяются сервером по сессии, а не из тела запроса.

    Доступ к чужим объектам возвращает 404. Все даты — RFC 3339, UTC.

    Поток чата описан дополнительно в chat-events.md.


    Нормативные переходы и повторы: behavior.md. Примеры: examples/scenario.json.'
servers:
- url: /api/v1
security:
- sessionCookie: []
tags:
- name: Session
- name: Onboarding
- name: Chat
- name: Requests
- name: Mentor
