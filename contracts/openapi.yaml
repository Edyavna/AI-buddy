    put:
      tags:
      - Onboarding
      operationId: setMyCheckpointConfirmation
      description: Устанавливает или отзывает собственное подтверждение. Правила revision и повторов описаны в behavior.md.
      parameters:
      - name: step_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetCheckpointConfirmation'
      responses:
