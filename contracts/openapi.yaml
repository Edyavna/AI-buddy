  /onboarding/steps/{step_id}:
    parameters:
    - name: step_id
      in: path
      required: true
      schema:
        type: string
    patch:
      tags:
      - Onboarding
      operationId: updateStep
      description: 'Стажёр меняет статус. Завершение через PATCH доступно для intern; blocked выставляет сервер.

        Пока доступ не подтвержден сервисом, зависимый шаг нельзя завершить (409).

        Сервер возвращает весь обновленный план, включая прогресс и следующий шаг.


        Разрешенные цели указаны в Step.allowed_statuses; повтор текущего пользовательского статуса возвращает 200.
        См. behavior.md.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStep'
      responses:
        '200':
          description: Обновленный план
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        default:
          $ref: '#/components/responses/Error'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
